<title>JP Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@500;700&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column app. Library grid -> notebook (section rows) -> section (tab chain) -> tab (connection, idea, sketch, try it, check). */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#101A26; --muted:#5A6878; --line:#D3DAE3;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --amber:#B45309; --ok:#15803D; --bad:#B91C1C; --soft:#E6ECF7;
  --sk-paper:#FBFCFE; --sk-grid:#E1E8F2; --sk-ink:#1B2A3A; --sk-red:#D6372F; --sk-blue:#1D4ED8; --sk-green:#15803D;
  --sk-yellow:#FFE45C; --sk-pink:#FFB3C7; --sk-mint:#9DEBC3;
  --f-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --f-serif:'Playfair Display',Georgia,serif; --f-serif2:'Cormorant Garamond',Georgia,serif;
  --f-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C131C; --surface:#131D29; --ink:#E7EDF4; --muted:#93A1B3; --line:#243244;
  --accent:#7EA2FF; --accent-ink:#0C131C; --amber:#F0B35A; --ok:#4ADE80; --bad:#FF8A8A; --soft:#182638;
  --sk-paper:#17202B; --sk-grid:#223244; --sk-ink:#E9EEF5; --sk-red:#FF7B72; --sk-blue:#8DB0FF; --sk-green:#6EE7A0;
  --sk-yellow:#C9A92B; --sk-pink:#C0587A; --sk-mint:#2E9C6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131C; --surface:#131D29; --ink:#E7EDF4; --muted:#93A1B3; --line:#243244;
  --accent:#7EA2FF; --accent-ink:#0C131C; --amber:#F0B35A; --ok:#4ADE80; --bad:#FF8A8A; --soft:#182638;
  --sk-paper:#17202B; --sk-grid:#223244; --sk-ink:#E9EEF5; --sk-red:#FF7B72; --sk-blue:#8DB0FF; --sk-green:#6EE7A0;
  --sk-yellow:#C9A92B; --sk-pink:#C0587A; --sk-mint:#2E9C6E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
#app{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-bottom:22px}
.crumbs a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{opacity:.5}
.btn{text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* Library */
.lib-head{display:flex;flex-wrap:wrap;gap:14px 24px;justify-content:space-between;align-items:flex-end;margin-bottom:26px}
.lib-head h1{font-size:clamp(30px,6vw,46px);font-weight:700}
.lib-head p{margin:8px 0 0;color:var(--muted);max-width:52ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-decoration:none;color:inherit;min-width:0}
a.card:hover{border-color:var(--accent)}
.card .no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.card h3{font-size:22px}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.card .meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.card .err{font-size:13px;color:var(--bad);font-family:var(--f-mono)}
.card.empty{border-style:dashed;background:transparent;color:var(--muted);justify-content:center;align-items:flex-start}

/* Notebook */
.nb-head h1{font-size:clamp(28px,5.5vw,42px)}
.nb-head p{color:var(--muted);margin:8px 0 16px;max-width:60ch}
.nb-head .bar{max-width:380px}
.secs{margin-top:28px;display:flex;flex-direction:column}
.sec{display:grid;grid-template-columns:1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-decoration:none;color:inherit}
a.sec:hover{border-color:var(--accent)}
.sec .lab{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sec h3{font-size:22px}
.sec p{margin:0;color:var(--muted);font-size:15px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.link-between{margin:0 0 0 22px;padding:12px 6px 12px 18px;border-left:2px solid var(--accent);color:var(--muted);font-size:14.5px;max-width:70ch}
.link-between b{color:var(--ink);font-weight:600}

/* Section + tabs */
.sec-head h1{font-size:clamp(26px,5vw,38px)}
.sec-head p{color:var(--muted);margin:8px 0 18px;max-width:62ch}
.chain{display:flex;gap:0;overflow-x:auto;padding:4px 2px 12px;margin-bottom:6px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 8px;font-size:13.5px;max-width:230px;white-space:nowrap}
.chip .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;background:var(--soft);flex:none}
.chip .t{overflow:hidden;text-overflow:ellipsis}
.chip.on{border-color:var(--accent);background:var(--soft);font-weight:600}
.chip.on .n{background:var(--accent);color:var(--accent-ink)}
.chip.done .n{background:var(--ok);color:#fff}
.join{flex:0 0 22px;align-self:center;height:2px;background:var(--line)}

.tab{display:flex;flex-direction:column;gap:20px}
.tab>h2{font-size:clamp(24px,4.6vw,34px)}
.conn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conn>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;font-size:14px;min-width:0}
.conn .k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.conn button.ref{align-self:flex-start;border:0;background:var(--soft);color:var(--accent);border-radius:6px;padding:3px 9px;font-weight:600;font-size:13.5px;text-align:left}
.conn button.ref:hover{text-decoration:underline}
.conn p{margin:0;color:var(--muted)}
.idea{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.idea li{font-size:18.5px;line-height:1.45;padding-left:22px;position:relative;max-width:62ch}
.idea li::before{content:"";position:absolute;left:0;top:.62em;width:11px;height:2px;background:var(--accent);transform:rotate(-8deg);border-radius:2px}
.idea b{font-weight:600;color:var(--accent)}
.blockhead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:8px}
.blockhead h3{font-size:13px;font-family:var(--f-mono);font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .15s}
.sw .tr::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw input:checked+.tr{background:var(--accent)}
.sw input:checked+.tr::after{transform:translateX(14px)}
.sw input:focus-visible+.tr{outline:2px solid var(--accent);outline-offset:2px}

/* Sketch */
.sketch{background:var(--sk-paper);border:1px solid var(--line);border-radius:12px;padding:10px 10px 14px;
  background-image:linear-gradient(var(--sk-grid) 1px,transparent 1px),linear-gradient(90deg,var(--sk-grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.sketch svg{display:block;width:100%;height:auto;max-height:480px;touch-action:manipulation}
.sketch text{font-family:var(--f-hand);font-weight:700;dominant-baseline:alphabetic}
.sketch .ph{fill:var(--sk-paper);stroke:var(--sk-ink);stroke-width:1.6;stroke-dasharray:5 4;opacity:.9;cursor:pointer}
.sketch .phq{font-family:var(--f-hand);font-size:22px;fill:var(--sk-ink);opacity:.55;pointer-events:none}
.take{margin:8px 6px 0;padding:10px 16px;border:2.5px solid var(--sk-ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;
  font-family:var(--f-hand);font-weight:700;font-size:clamp(22px,4.4vw,28px);line-height:1.2;color:var(--sk-ink);background:color-mix(in srgb,var(--sk-yellow) 35%,transparent);
  opacity:0;transform:translateY(4px) rotate(-.6deg);transition:opacity .4s,transform .4s}
.take.on{opacity:1;transform:rotate(-.6deg)}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}

/* Widgets */
.w{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:18px;min-width:0}
.w-qubit{grid-template-columns:minmax(0,1fr)}
.w-qubit.hasbloch{grid-template-columns:minmax(220px,300px) minmax(0,1fr)}
.w canvas{width:100%;aspect-ratio:1/1;display:block;border-radius:10px;background:var(--soft)}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sl{display:grid;grid-template-columns:76px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.sl label{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.sl output{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.pbar{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:center;font-size:14px}
.pbar .lab{font-family:var(--f-mono);font-size:13px}
.pbar .trk{height:20px;border-radius:5px;background:var(--soft);overflow:hidden;position:relative}
.pbar .trk i{display:block;height:100%;background:var(--accent);transition:width .25s}
.pbar .trk i.b{background:var(--amber)}
.pbar .sub{grid-column:2;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.ro{display:grid;grid-template-columns:36px 1fr;gap:4px 10px;align-items:center;font-size:13px}
.ro .nm{font-family:var(--f-mono);font-weight:500}
.ro .split{display:flex;height:20px;border-radius:5px;overflow:hidden;background:var(--soft);font-family:var(--f-mono);font-size:12px}
.ro .split span{display:grid;place-items:center;color:#fff;white-space:nowrap;overflow:hidden;transition:flex-basis .25s}
.ro .split .p{background:var(--accent);color:var(--accent-ink)}
.ro .split .m{background:var(--amber);color:#fff}
.mini{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.sw-key{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin:0 2px}
.msg{font-size:14px;padding:9px 12px;border-radius:8px;background:var(--soft);min-height:40px;font-family:var(--f-mono);font-size:13px;line-height:1.5}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.hist{display:grid;grid-template-columns:50px 1fr 46px;gap:6px 10px;align-items:center;font-family:var(--f-mono);font-size:12.5px}
.hist .trk{height:16px;background:var(--soft);border-radius:4px;overflow:hidden}
.hist .trk i{display:block;height:100%;background:var(--accent)}
.hist .trk i.b{background:var(--amber)}
select{font:inherit;font-size:13.5px;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.amps{display:grid;gap:6px}
.amp{display:grid;grid-template-columns:54px minmax(0,1fr) 92px;gap:10px;align-items:center;font-family:var(--f-mono);font-size:13px}
.amp .trk{height:22px;background:var(--soft);border-radius:5px;overflow:hidden}
.amp .trk i{display:block;height:100%;background:var(--accent);transition:width .25s}
.amp.zero{opacity:.38}
.amp .v{text-align:right;font-variant-numeric:tabular-nums}
.test{display:grid;gap:4px;font-family:var(--f-mono);font-size:13px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
.test .verdict{font-weight:600;font-size:14px}
.test .verdict.yes{color:var(--ok)} .test .verdict.no{color:var(--amber)}

/* Check */
.check{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.check .q{font-size:17px;font-weight:500}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.why{font-size:14.5px;color:var(--muted)}

.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding-top:6px}
.bridge{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bridge .k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bridge p{margin:0;font-size:16.5px;max-width:64ch}

/* How to */
.howto pre{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-height:64vh;overflow:auto;margin:14px 0 0}
.howto p{color:var(--muted);max-width:62ch}

@media (max-width:640px){
  .conn{grid-template-columns:1fr}
  .w-qubit.hasbloch{grid-template-columns:minmax(0,1fr)}
  .w canvas{max-width:320px;margin:0 auto}
  .sl{grid-template-columns:62px 1fr 56px}
  .amp{grid-template-columns:46px minmax(0,1fr) 78px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- Amped-up look ---- */
body{background:radial-gradient(1100px 600px at 85% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 10%,color-mix(in srgb,var(--amber) 12%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.card,.sec,.w,.check,.conn>div,.bridge{box-shadow:0 1px 2px rgba(16,26,38,.05),0 8px 24px -14px rgba(16,26,38,.25)}
.btn{transition:transform .15s,border-color .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#8B5CF6));border:0}
.bar>i{background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#22D3EE))}
.lib-head h1{background:linear-gradient(120deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{position:relative;overflow:hidden;padding:20px 20px 18px 28px;transition:transform .2s,box-shadow .2s,border-color .2s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--c,var(--accent))}
.card::after{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35)}
a.card:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 18px 36px -16px rgba(16,26,38,.4)}
.grid .card:nth-child(4n+1){--c:#1D4ED8}.grid .card:nth-child(4n+2){--c:#B45309}.grid .card:nth-child(4n+3){--c:#0F766E}.grid .card:nth-child(4n+4){--c:#7C3AED}
.card.empty{padding-left:20px}.card.empty::before,.card.empty::after{display:none}
.sec{transition:transform .15s,border-color .15s}a.sec:hover{transform:translateX(4px)}



/* ===== Apple Music x Liquid Glass ===== */
:root{--bg:#F2F2F7;--surface:rgba(255,255,255,.62);--ink:#1D1D1F;--muted:#6E6E73;--line:rgba(0,0,0,.08);--accent:#FA2D48;--accent-ink:#fff;--soft:rgba(250,45,72,.08);
  --g-bg:rgba(255,255,255,.55);--g-bd:rgba(255,255,255,.75);--g-hi:rgba(255,255,255,.95);--g-sh:0 10px 40px -14px rgba(0,0,0,.2);
  --f-display:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;--f-body:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  --f-serif:var(--f-display);--f-serif2:var(--f-body)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:rgba(44,44,48,.5);--ink:#F5F5F7;--muted:#98989D;--line:rgba(255,255,255,.1);--accent:#FF375F;--accent-ink:#fff;--soft:rgba(255,55,95,.15);
  --g-bg:rgba(38,38,42,.5);--g-bd:rgba(255,255,255,.12);--g-hi:rgba(255,255,255,.22);--g-sh:0 10px 40px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#000;--surface:rgba(44,44,48,.5);--ink:#F5F5F7;--muted:#98989D;--line:rgba(255,255,255,.1);--accent:#FF375F;--accent-ink:#fff;--soft:rgba(255,55,95,.15);
  --g-bg:rgba(38,38,42,.5);--g-bd:rgba(255,255,255,.12);--g-hi:rgba(255,255,255,.22);--g-sh:0 10px 40px -14px rgba(0,0,0,.7)}
html,body{overflow-x:clip}
body{background:var(--bg);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;filter:blur(40px);background:
  radial-gradient(40% 35% at 12% 8%,rgba(255,45,85,.22),transparent 70%),radial-gradient(35% 35% at 88% 12%,rgba(94,92,230,.24),transparent 70%),
  radial-gradient(40% 40% at 72% 88%,rgba(100,210,255,.2),transparent 70%),radial-gradient(35% 30% at 8% 82%,rgba(255,159,10,.16),transparent 70%)}
h1,h2,h3{letter-spacing:-.025em;font-weight:700}
.glass,.card,.sec,.w,.check,.conn>div,.bridge,.crumbs,.chip,.btn,.opt,.howto pre{background:var(--g-bg);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--g-bd);box-shadow:inset 0 1px 0 var(--g-hi),var(--g-sh)}
.card,.sec,.w,.check,.conn>div,.bridge,.sketch,.howto pre{border-radius:22px}
.opt{border-radius:14px}
.btn{border-radius:999px;font-weight:600}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 8px 22px -8px var(--accent)}
.bar{background:var(--line)}.bar>i{background:var(--accent)}
.crumbs{display:inline-flex;padding:7px 16px;border-radius:999px;font-family:var(--f-body);font-size:13px}
.crumbs a{border:0;color:var(--accent);font-weight:500}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}.chip.on .n{background:rgba(255,255,255,.25);color:#fff}

<script type="text/plain" id="howto-src">
HOW TO WRITE A NOTEBOOK FOR MY LIBRARY

You are writing ONE notebook for a personal study library. The reader is Prathamesh Joshi, a CS PhD student working on quantum error correction (QEC), AI systems, and quantum-classical systems. He wants foundations burned into memory. He does not want a text dump. Everything must be visual, short and crisp.

OUTPUT
Return exactly one JavaScript file, notebooks/<id>.js, in one code block. It calls NB.register({...}) once. No HTML, no extra commentary inside the file. After the code block add one line: the filename to add to notebooks/index.js.

----------------------------------------------------------------
1. STRUCTURE
Notebook  >  Sections  >  Tabs

Notebook fields
  id         kebab-case, letters digits hyphens only (example: qec-basics)
  title      2 to 4 words
  subtitle   one line, what the reader will be able to do afterwards
  sections   array, 3 to 6 sections

Section = one broad concept. Fields
  title      short
  intro      1 to 2 sentences
  bridge     1 to 2 sentences saying how THIS section connects to the NEXT section.
             For the last section, say what the reader needs next.
  tabs       array, 3 to 7 tabs

Tab = one small step. Tabs run from the smallest piece up to the whole concept. A tab may use only ideas from earlier tabs (or earlier notebooks in the library order).

----------------------------------------------------------------
2. TAB TEMPLATE (every field is required)
  title      short noun phrase
  buildsOn   1 sentence: which earlier tab or section this uses, and what it takes from it.
  leadsTo    1 sentence: what the next tab does with this one, and why it is needed.
  idea       2 to 4 short lines, each at most 140 characters. Bold a key term with *asterisks*.
  sketch     array of drawing parts (see 4)
  takeaway   one line, at most 80 characters. The thing to remember.
  widget     one interactive visual (see 5), or null
  check      one multiple choice question: { q, options (3 or 4), answer (index), why }

CONNECTION RULE (most important)
Every tab must say how it connects to its neighbours. buildsOn and leadsTo are mandatory, must be specific (name the idea, not "the previous tab"), and each must be at least 25 characters. The first tab of a section builds on the previous section's bridge. The last tab of a section leads into the section's bridge.

----------------------------------------------------------------
3. WRITING RULES
- Plain Unicode math only: α β θ φ ψ |0⟩ ⟨0| ² ₀ ₁ ⊕ √ ⇔ →. No LaTeX, no code blocks, no markdown except *bold*.
- NO em dashes and NO en dashes anywhere. Use a period or a comma.
- Short, direct sentences. Define every symbol on first use in the notebook.
- No filler: no "it is worth noting", no "let us", no "in this tab we will".
- Facts about a specific paper must be checked against the paper. If unsure, leave it out.
- Prefer one concrete example over a general statement.

----------------------------------------------------------------
4. SKETCH SPEC
Each tab has a hand-drawn sketch that draws itself in order, on a canvas of 640 wide by 320 tall. Use the helpers (already defined, destructure them at the top of your file):

  const { T, B, A, L, K, O, E, H, D } = NB.sk;

  T(x, y, 'text', opts)        handwritten label. (x, y) is the text baseline start. Use \n for a second line.
                               opts: size (default 26), c (color), anchor ('start' | 'middle' | 'end'), keep (true = never hidden)
  B(x, y, w, h, opts)          rough box, top-left corner and size
  A(x1, y1, x2, y2, opts)      arrow from (x1,y1) to (x2,y2)
  L([[x,y],[x,y],...], opts)   rough polyline
  K([[x,y],...], opts)         smooth curve through points
  O(x, y, r, opts)             circle, centre and radius
  E(x, y, rx, ry, opts)        ellipse
  H(x, y, w, h, opts)          highlighter bar. Draw it BEFORE the text it sits behind.
  D(x, y, opts)                filled dot

  Shared opts: c = 'ink' | 'red' | 'blue' | 'green' | 'yellow' | 'pink' | 'mint' (default ink), dash = true for dashed.
  Highlight colors: yellow, pink, mint.

Rules
  - 6 to 18 parts. Parts are drawn in the order listed, so list them in teaching order: smallest piece first.
  - Keep every coordinate inside 0..640 and 0..320. Keep 20px margins. Leave space around text (about 12px per character at size 26).
  - At least 3 text labels. Labels are hidden by the "Cover and recall" switch so the reader can test memory. Set keep:true only for things that are not the point (for example "0 or 1" in a bit box).
  - Do not draw sentences. Draw the shape of the idea: boxes, arrows, a circuit, a sphere, a table. Text is labels.
  - Use red and blue to separate two things being compared, green for "this is the result", yellow highlight for the one thing to remember.

----------------------------------------------------------------
5. WIDGETS (the interactive "Try it" block)
  { type: 'qubit', ...options }       one qubit
      sliders: ['theta','phi'] (default both; use [] for none), bloch: true|false, gates: ['X','Y','Z','H','S'],
      readouts: true (Z/X/Y odds), shots: true (sample readouts), collapse: true (measure and collapse),
      start: { theta: 60, phi: 0 }  (degrees)
  { type: 'multi', n: 2 | 3, ...options }      several qubits as amplitudes of patterns
      presets: ids from zero2 plus0 plusplus bell bellm skew zero3 plus00 ghz log enc; start: id
      slider: 'log' (alpha|000> + beta|111>) or 'enc' ((alpha|0>+beta|1>)|00>)
      ops: 'H1' 'X2' 'Z3' 'RX2' (tiny 20 degree tilt) 'CNOT12' (control 1, target 2)
      measure: [1,2] (read single qubits), parity: [[1,2],[2,3]], syndrome: true,
      independence: true (n=2 product test), codeSpace: true, reset: true
  { type: 'steps', steps: [ { say: 'sentence', show: 'one line of math' }, ... ] }   reveal a derivation one line at a time
  null   no widget

If you need a widget that does not exist, use 'steps' and say so in a one-line comment at the top of the file so the library owner can add it.

----------------------------------------------------------------
6. CHECK QUESTION
One question per tab. Three or four options, exactly one right, plausible wrong ones that match real misunderstandings. "why" is one sentence.

----------------------------------------------------------------
7. EXAMPLE TAB
{
  title: 'Squares add to 1',
  buildsOn: 'The last tab gave you α and β as raw amplitudes. This tab fixes how large they may be.',
  leadsTo: 'Next, measuring. The squares |α|² and |β|² become the odds of each readout.',
  idea: [
    '|α|² is the weight on 0 and |β|² the weight on 1.',
    'All weight sums to one: *|α|² + |β|² = 1*.'
  ],
  sketch: [
    L([[90,260],[250,260],[250,140],[90,260]]),
    T(170,296,'α',{anchor:'middle',c:'red',size:32}),
    T(278,208,'β',{anchor:'middle',c:'blue',size:32}),
    H(330,66,260,52,{c:'yellow'}),
    T(460,104,'|α|² + |β|² = 1',{anchor:'middle',size:36})
  ],
  takeaway: '|α|² + |β|² = 1. Always.',
  widget: { type:'qubit', sliders:['theta'], start:{theta:74,phi:0} },
  check: { q:'α = 0.6 (real). What is |β|?', options:['0.8','0.4','0.64','1'], answer:0, why:'0.6² = 0.36, so |β|² = 0.64.' }
}

----------------------------------------------------------------
8. REGISTRATION
Wrap the file as:
  (function () {
    const { T, B, A, L, K, O, E, H, D } = NB.sk;
    NB.register({ id: '...', title: '...', subtitle: '...', sections: [ ... ] });
  })();
The library owner then adds 'notebooks/<id>.js' to the list in notebooks/index.js. The library runs a validator on load. A notebook that fails it shows its errors on its card.

----------------------------------------------------------------
9. CHECKLIST (verify each item before you return the file)
[ ] One NB.register call, valid JavaScript, no trailing prose inside the file.
[ ] 3 to 6 sections, each with intro and bridge; 3 to 7 tabs each.
[ ] Every tab has buildsOn and leadsTo, specific, each 25+ characters, and they agree with the neighbouring tabs.
[ ] Tabs go from smallest piece upward. No tab uses an idea that appears later.
[ ] Every tab has 2 to 4 idea lines of at most 140 characters.
[ ] Every sketch has 6 to 18 parts, inside 640 x 320, with 3 or more text labels, drawn in teaching order.
[ ] Every tab has a takeaway of at most 80 characters, a widget (or null) and a check with a valid answer index.
[ ] No em dashes, no en dashes, no LaTeX, no code blocks in any string.
[ ] Math is readable plain Unicode.
[ ] Every claim is true. Anything about a paper was checked against the paper.
</script>

function sketchBlock(tab,tid){

  const svg=sv('svg',{viewBox:'0 0 640 330',role:'img','aria-label':'Hand-drawn sketch: '+tab.takeaway});

  const w=widgetFor(tab.widget);
  const chk=checkBlock(tab.check);
  const doneBtn=h('button',{class:'btn pri',type:'button',onclick:()=>{store.done[dkey(nb,si,ti)]=1;save();if(nbr.next)go(nbr.next.go.slice(1));else viewSection(nb,si,ti);}},nbr.next?'Got it. Next':'Got it');
  const isLast=ti===s.tabs.length-1;
  body.append(h('article',{class:'tab'},
    h('h2',null,'Tab '+(ti+1)+'. '+tab.title),
    h('div',{class:'conn'},
      h('div',null,h('span',{class:'k'},'← Builds on'),refBtn(nbr.prev,'Start of the notebook'),h('p',null,tab.buildsOn)),
      h('div',null,h('span',{class:'k'},'Leads to →'),refBtn(nbr.next,'End of the notebook'),h('p',null,tab.leadsTo))),
    h('ul',{class:'idea'},tab.idea.map(l=>h('li',{html:rich(l)}))),
    sk,
    w?h('div',null,h('div',{class:'blockhead'},h('h3',null,'Try it')),w):null,
    chk,
    isLast?h('div',{class:'bridge'},h('span',{class:'k'},'How this section connects to the next'),h('p',null,s.bridge)):null,
    h('div',{class:'nav'},
      nbr.prev?h('button',{class:'btn',type:'button',onclick:()=>go(nbr.prev.go.slice(1))},'← '+nbr.prev.t):h('span'),
      h('div',{class:'row'},isDone(nb,si,ti)?h('span',{class:'mini'},'Marked done'):null,doneBtn)))
  );
  sk._start();
}
function checkBlock(c){
  let locked=false;const why=h('div',{class:'why',hidden:true},c.why);
  const opts=c.options.map((t,i)=>h('button',{class:'opt',type:'button',onclick:()=>{
    if(locked)return;if(i===c.answer){locked=true;opts[i].classList.add('right');why.hidden=false;}else{opts[i].classList.add('wrong');}}},t));
  return h('div',{class:'check'},h('div',{class:'blockhead',style:'margin:0'},h('h3',null,'Check yourself')),h('div',{class:'q'},c.q),h('div',{class:'opts'},opts),why);
}
function viewNotFound(){app.textContent='';app.append(h('p',null,'That page is not in the library.'),h('a',{class:'btn',href:'#'},'Back to the library'));}

function route(){
  const po=document.querySelector('.pull');if(po)po.remove();
  const hs=decodeURIComponent(location.hash.slice(1));let m;
  window.scrollTo(0,0);
  document.body.classList.toggle('home',!hs||hs==='shelf');
  if(!hs||hs==='shelf')return viewLibrary();
  if(hs==='how-to-write')return viewHowTo();
  if(m=hs.match(/^(.+)-s(\d+)-t(\d+)$/)){const nb=nbById(m[1]);if(nb)try{localStorage.setItem('jpLibrary.last',nb.id);}catch(e){}if(nb&&nb.sections[m[2]-1]&&nb.sections[m[2]-1].tabs[m[3]-1])return viewSection(nb,+m[2]-1,+m[3]-1);}
  if(m=hs.match(/^(.+)-s(\d+)$/)){const nb=nbById(m[1]);if(nb&&nb.sections[m[2]-1])return viewSection(nb,+m[2]-1,0);}
  const nb=nbById(hs);if(nb){try{localStorage.setItem('jpLibrary.last',nb.id);}catch(e){}return viewNotebook(nb);}
  viewNotFound();
}
window.addEventListener('hashchange',route);

/* ---------- load notebook files in order, then start ---------- */
const files=(window.NB_FILES||[]).slice();
(function next(i){
  if(i>=files.length){route();window.__libReady=true;return;}
  const sc=document.createElement('script');sc.src=files[i];
  sc.onload=()=>next(i+1);
  sc.onerror=()=>{NB.loadErrors.push('File not found: '+files[i]);next(i+1);};
  document.body.append(sc);
})(0);
window.__NBdbg={NB,W,validate};
})();
</script>
